# RepLog on a VPS: the Next.js app, an hourly Drive-backup trigger and Caddy (automatic HTTPS).
# Supabase (Postgres/Auth/Storage) is NOT in here: run it separately (docs/self-hosting.md) or use the hosted one.
# Copy .env.example to .env and fill it in, then:  docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in .env}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  # /api/drive/cron has no session: it only checks CRON_SECRET. Called hourly, inside the compose network.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 3600
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/drive/cron || true
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
